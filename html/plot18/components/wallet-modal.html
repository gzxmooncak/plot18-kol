<!-- Wallet Selection Modal -->
<div id="walletSelectModal" class="fixed inset-0 z-[10000] hidden flex items-center justify-center pointer-events-none">
    <div class="absolute inset-0 bg-black/80 backdrop-blur-sm transition-opacity pointer-events-auto" onclick="closeWalletModal()"></div>
    
    <div class="relative bg-dark-gray border border-bullish-green/50 p-6 sm:p-8 max-w-sm w-[90%] mx-auto cyber-panel z-10 pointer-events-auto shadow-[0_0_30px_rgba(0,255,65,0.2)] transform transition-transform scale-95 opacity-0" id="walletModalContent">
        <!-- Close Button -->
        <button onclick="closeWalletModal()" class="absolute top-4 right-4 text-gray-500 hover:text-white transition-colors">
            <i class="fa-solid fa-xmark text-xl"></i>
        </button>

        <h3 class="text-2xl font-impact tracking-widest text-white mb-2 text-center">CONNECT <span class="text-bullish-green">WALLET</span></h3>
        <p class="text-xs text-gray-400 font-terminal text-center mb-6">SELECT YOUR PROVIDER TO INITIATE UPLINK</p>

        <div class="space-y-3">
            <!-- MetaMask -->
            <button onclick="handleWalletSelection('metamask')" class="w-full relative group">
                <div class="absolute inset-0 bg-gradient-to-r from-orange-500/20 to-transparent opacity-0 group-hover:opacity-100 transition-opacity"></div>
                <div class="bg-black border border-gray-800 group-hover:border-orange-500/50 p-4 flex items-center justify-between transition-all group-hover:translate-x-1">
                    <div class="flex items-center gap-4">
                        <img src="images/wallets/metamask.png" alt="MetaMask" class="w-8 h-8 object-contain">
                        <span class="font-terminal font-bold text-gray-200 group-hover:text-white">MetaMask</span>
                    </div>
                    <i class="fa-solid fa-chevron-right text-gray-600 group-hover:text-orange-500 text-sm"></i>
                </div>
            </button>

            <!-- OKX Wallet -->
            <button onclick="handleWalletSelection('okx')" class="w-full relative group">
                <div class="absolute inset-0 bg-gradient-to-r from-white/10 to-transparent opacity-0 group-hover:opacity-100 transition-opacity"></div>
                <div class="bg-black border border-gray-800 group-hover:border-white/50 p-4 flex items-center justify-between transition-all group-hover:translate-x-1">
                    <div class="flex items-center gap-4">
                        <img src="images/wallets/okx.png" alt="OKX" class="w-8 h-8 object-contain">
                        <span class="font-terminal font-bold text-gray-200 group-hover:text-white">OKX Wallet</span>
                    </div>
                    <i class="fa-solid fa-chevron-right text-gray-600 group-hover:text-white text-sm"></i>
                </div>
            </button>

            <!-- TokenPocket -->
            <button onclick="handleWalletSelection('tokenpocket')" class="w-full relative group">
                <div class="absolute inset-0 bg-gradient-to-r from-blue-500/20 to-transparent opacity-0 group-hover:opacity-100 transition-opacity"></div>
                <div class="bg-black border border-gray-800 group-hover:border-blue-500/50 p-4 flex items-center justify-between transition-all group-hover:translate-x-1">
                    <div class="flex items-center gap-4">
                        <img src="images/wallets/tokenpocket.png" alt="TokenPocket" class="w-8 h-8 object-contain rounded-sm">
                        <span class="font-terminal font-bold text-gray-200 group-hover:text-white">TokenPocket</span>
                    </div>
                    <i class="fa-solid fa-chevron-right text-gray-600 group-hover:text-blue-500 text-sm"></i>
                </div>
            </button>

            <!-- Coinbase Wallet -->
            <button onclick="handleWalletSelection('coinbase')" class="w-full relative group">
                <div class="absolute inset-0 bg-gradient-to-r from-blue-500/20 to-transparent opacity-0 group-hover:opacity-100 transition-opacity"></div>
                <div class="bg-black border border-gray-800 group-hover:border-blue-500/50 p-4 flex items-center justify-between transition-all group-hover:translate-x-1">
                    <div class="flex items-center gap-4">
                        <img src="images/wallets/coinbase.png" alt="Coinbase" class="w-8 h-8 object-contain rounded-full">
                        <span class="font-terminal font-bold text-gray-200 group-hover:text-white">Coinbase Wallet</span>
                    </div>
                    <i class="fa-solid fa-chevron-right text-gray-600 group-hover:text-blue-500 text-sm"></i>
                </div>
            </button>

            <!-- Trust Wallet -->
            <button onclick="handleWalletSelection('trustwallet')" class="w-full relative group">
                <div class="absolute inset-0 bg-gradient-to-r from-blue-400/20 to-transparent opacity-0 group-hover:opacity-100 transition-opacity"></div>
                <div class="bg-black border border-gray-800 group-hover:border-blue-400/50 p-4 flex items-center justify-between transition-all group-hover:translate-x-1">
                    <div class="flex items-center gap-4">
                        <img src="images/wallets/trustwallet.png" alt="Trust Wallet" class="w-8 h-8 object-contain">
                        <span class="font-terminal font-bold text-gray-200 group-hover:text-white">Trust Wallet</span>
                    </div>
                    <i class="fa-solid fa-chevron-right text-gray-600 group-hover:text-blue-400 text-sm"></i>
                </div>
            </button>

            <!-- SafePal -->
            <button onclick="handleWalletSelection('safepal')" class="w-full relative group">
                <div class="absolute inset-0 bg-gradient-to-r from-gray-400/20 to-transparent opacity-0 group-hover:opacity-100 transition-opacity"></div>
                <div class="bg-black border border-gray-800 group-hover:border-gray-400/50 p-4 flex items-center justify-between transition-all group-hover:translate-x-1">
                    <div class="flex items-center gap-4">
                        <img src="images/wallets/safepal.png" alt="SafePal" class="w-8 h-8 object-contain rounded-sm">
                        <span class="font-terminal font-bold text-gray-200 group-hover:text-white">SafePal</span>
                    </div>
                    <i class="fa-solid fa-chevron-right text-gray-600 group-hover:text-gray-400 text-sm"></i>
                </div>
            </button>
            <div class="text-center mt-4 pt-2 border-t border-gray-800">
               <span class="text-[10px] text-gray-600 font-terminal block">// SECURE PROTOCOL V1.0 //</span>
            </div>
        </div>
    </div>
</div>

<style>
/* Wallet Modal Animation Classes */
#walletSelectModal.active {
    display: flex;
}
#walletSelectModal.active #walletModalContent {
    transform: scale(1);
    opacity: 1;
}
</style>
